{% extends 'myapp/base.html' %}

{% block title %}Simulation Laser{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Paramètres</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.I0.label_tag }}
                        {{ form.I0 }}
                    </div>
                    <div class="mb-3">
                        {{ form.gamma.label_tag }}
                        {{ form.gamma }}
                    </div>
                    <button type="submit" class="btn btn-danger w-100">
                        <i class="bi bi-play-fill"></i> Simuler
                    </button>
                </form>
                <a href="{% url 'myapp:numerisation' %}" class="btn btn-secondary w-100 mt-2">
                    <i class="bi bi-arrow-left"></i> Retour
                </a>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Résultat</h5>
            </div>
            <div class="card-body">
                <div id="plot"></div>
            </div>
        </div>
    </div>
</div>

{% if result %}
<script>
    var data = [{
        x: {{ result.t|safe }},
        y: {{ result.I|safe }},
        type: 'scatter',
        mode: 'lines',
        line: {color: '#e74c3c', width: 2}
    }];

    var layout = {
        title: 'Décroissance Laser',
        xaxis: {title: 'Temps'},
        yaxis: {title: 'Intensité'},
        plot_bgcolor: '#f8f9fa',
        paper_bgcolor: '#ffffff'
    };

    Plotly.newPlot('plot', data, layout);
</script>
{% endif %}
{% endblock %}
